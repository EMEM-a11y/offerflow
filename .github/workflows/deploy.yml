name: Verify and publish OfferFlow
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

concurrency:
  group: offerflow-pages
  cancel-in-progress: false

jobs:
  rules:
    name: Check application rule sources
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/application-rules.test.mjs
      - name: Restore last successful source records
        uses: actions/cache@v4
        with:
          path: work/application-rule-baseline.json
          key: application-rules-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: application-rules-v1-
      - name: Collect and compare public rule sources
        run: node scripts/collect-application-rules.mjs
      - name: Save rule review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-rule-review
          path: |
            work/application-rule-candidates.json
            work/application-rule-review.md
          retention-days: 30
          if-no-files-found: warn
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check:questions
      - run: pnpm check:duplicates
      - run: pnpm update:jobs
      - name: Require release configuration
        env:
          RELEASE_READY: ${{ vars.RELEASE_READY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          test "$RELEASE_READY" = "true" || { echo "Complete the release checklist before enabling publication."; exit 1; }
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "Configure the public Turnstile site key before publication."; exit 1; }
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          OFFERFLOW_BASE: /
        run: |
          pnpm build
      - run: pnpm check:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
